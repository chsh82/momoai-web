name: Deploy to GCP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check (빠른 오류 감지)
        run: |
          echo "Python 문법 검사 중..."
          find app -name "*.py" -exec python -m py_compile {} \;
          echo "문법 검사 통과"

      - name: Deploy to GCP server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: momoai.kr
          username: chsh82
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd ~/momoai_web
            echo "=== 최신 코드 동기화 ==="
            git fetch origin master
            git reset --hard origin/master
            echo "=== DB 마이그레이션 ==="
            cd ~/momoai_web
            if [ -f ~/momoai_web/venv/bin/python ]; then
              VENV_PYTHON=~/momoai_web/venv/bin/python
            elif [ -f /home/momoai/momoai_web/venv/bin/python ]; then
              VENV_PYTHON=/home/momoai/momoai_web/venv/bin/python
            else
              VENV_PYTHON=python3
            fi
            $VENV_PYTHON migrate_makeup_requested_date.py && echo "Migration OK" || echo "Migration failed (continuing)"
            $VENV_PYTHON migrate_ocr_status.py && echo "OCR status migration OK" || echo "OCR status migration failed (continuing)"
            $VENV_PYTHON migrate_ocr_history_types.py && echo "OCR types migration OK" || echo "OCR types migration failed (continuing)"
            $VENV_PYTHON migrate_add_essay_error_message.py && echo "Essay error_message migration OK" || echo "Essay error_message migration failed (continuing)"
            echo "=== Alembic 마이그레이션(flask db upgrade) ==="
            # 2026-09-19 추가: 위의 4개는 개별 ad-hoc 스크립트라 새 Alembic 리비전
            # (migrations/versions/)은 이걸로는 절대 안 걸린다 - db.create_all()이 앱
            # 기동 시 "없는 테이블"은 자동으로 만들어 주지만 "있는 테이블의 새 컬럼
            # 추가(ALTER TABLE)"는 못 한다(SQLAlchemy의 알려진 한계). 배포 전 로컬에서
            # deploy.sh가 이미 이 명령을 쓰고 있어 같은 방식으로 맞춘다 - DB 파일이
            # 커밋 전 상태로 백업된 뒤에 실행되므로 실패해도 되돌릴 수 있다.
            if [ -f ~/momoai_web/venv/bin/flask ]; then
              VENV_FLASK=~/momoai_web/venv/bin/flask
            elif [ -f /home/momoai/momoai_web/venv/bin/flask ]; then
              VENV_FLASK=/home/momoai/momoai_web/venv/bin/flask
            else
              VENV_FLASK="$VENV_PYTHON -m flask"
            fi
            DB_FILE=~/momoai_web/instance/momoai.db
            if [ -f "$DB_FILE" ]; then
              mkdir -p ~/momoai_web/backups
              cp "$DB_FILE" ~/momoai_web/backups/momoai_$(date +%Y%m%d_%H%M%S)_pre_alembic.db
              echo "DB 백업 완료(Alembic 마이그레이션 직전)"
            fi
            FLASK_APP=run.py $VENV_FLASK db upgrade && echo "Alembic 마이그레이션 OK" || echo "Alembic 마이그레이션 실패 - 로그 확인 필요(서비스는 계속 재시작됨)"
            echo "=== 서비스 재시작 ==="
            sudo systemctl restart momoai
            echo "=== 상태 확인 ==="
            sleep 2
            systemctl is-active momoai && echo "서비스 정상 실행 중" || echo "서비스 시작 실패!"
