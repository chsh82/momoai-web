<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>전공마을 탐험 · 저장 결과</title><link rel="stylesheet" href="{{ url_for('static',filename='css/interest-reports.css') }}"></head><body>
<header class="report-header"><div><b>MOMOAI · 전공마을 탐험</b><span>관심을 돌아보는 저장 결과</span></div><a class="return-link" href="/">닫기 · 모모아이로 돌아가기</a></header>
<main class="report-main">{% block content %}{% endblock %}</main>
<footer class="report-footer">이 자료는 관심 탐색을 돕는 기록이며 능력·적성의 확정 평가가 아니에요. 서로 다른 문항 버전의 점수를 비교하지 않아요.</footer>
<script>
(()=>{
 function close(){if(parent===window)return false;parent.postMessage({type:'momo-report-close'},location.origin);return true;}
 document.querySelector('.return-link').addEventListener('click',event=>{if(close())event.preventDefault();});
 addEventListener('keydown',event=>{if(event.key==='Escape'&&close())event.preventDefault();});
 document.querySelector('[data-report-new]')?.addEventListener('click',event=>{if(parent!==window){event.preventDefault();parent.postMessage({type:'momo-report-new'},location.origin);}});
})();
</script></body></html>
