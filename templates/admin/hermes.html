{% extends "base.html" %}

{% block title %}모모 에이전트 - MOMOAI v4.0{% endblock %}

{% block page_title %}🤖 모모 에이전트{% endblock %}

{% block page_subtitle %}
<span class="text-sm text-white text-opacity-70 ml-3">확정된 지시를 입력하면 확인 후 실행합니다</span>
{% endblock %}

{% block content %}
<style>
/* 메시지가 쌓여 스크롤이 생기는 순간 스크롤바 폭(약 15px)만큼 콘텐츠
   영역이 줄어들면서 레이아웃이 흔들리는 문제(2026-10-13 사용자 신고).
   scrollbar-gutter: stable로 공간을 "항상" 미리 확보해봤지만, 그러면
   스크롤이 필요 없을 때도 늘 그 폭만큼 좁은 상태가 되어 버려 오히려
   더 좁아 보인다는 재신고를 받았다 - 공간을 예약하는 대신 스크롤바
   자체를 시각적으로 숨겨서(스크롤 동작은 그대로 유지) 어떤 경우에도
   폭이 바뀌지 않게 한다. */
#hermesThreadList, #hermesMessages {
  scrollbar-width: none;      /* Firefox */
  -ms-overflow-style: none;   /* 구형 Edge/IE */
}
#hermesThreadList::-webkit-scrollbar, #hermesMessages::-webkit-scrollbar {
  display: none;              /* Chrome/Edge/Safari */
}
/* 모바일(슬랙 앱 패턴, 2026-10-13 요청): 좁은 화면에서는 스레드 목록과
   대화를 동시에 욱여넣지 않고, 한 번에 한 화면만 보여준다 - 목록에서
   스레드를 고르면 대화 화면으로 전환되고, 뒤로가기(‹)로 목록으로
   돌아간다. 데스크톱(768px 이상)에서는 이 규칙이 전혀 적용되지 않아
   기존처럼 둘 다 동시에 보인다. */
@media (max-width: 767.98px){
  #hermesLayout[data-view="list"] #hermesThreadPane{ display: none; }
  #hermesLayout[data-view="thread"] #hermesListPane{ display: none; }
}
</style>
<div id="hermesLayout" data-view="list" class="flex h-[calc(100vh-180px)] min-h-[480px] bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <!-- 왼쪽: 스레드 목록(슬랙 채널 목록처럼) -->
    <aside id="hermesListPane" class="w-full md:w-72 flex-shrink-0 border-r border-gray-100 flex flex-col bg-gray-50">
        <div class="p-3 border-b border-gray-100">
            <button id="hermesNewThreadBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-3 py-2 rounded-lg transition">
                + 새 대화
            </button>
        </div>
        <div id="hermesThreadList" class="flex-1 overflow-y-auto"></div>
    </aside>

    <!-- 오른쪽: 선택한 스레드의 대화 -->
    <section id="hermesThreadPane" class="flex-1 flex flex-col min-w-0">
        <div class="md:hidden flex items-center gap-2 px-3 py-2 border-b border-gray-100 flex-shrink-0">
            <button id="hermesBackBtn" class="text-gray-500 hover:text-gray-800 text-xl leading-none w-7 h-7 flex items-center justify-center rounded hover:bg-gray-100 transition" aria-label="목록으로">‹</button>
            <span class="text-sm font-medium text-gray-600">모모 에이전트</span>
        </div>
        <div id="hermesMessages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div id="hermesFooter" class="border-t border-gray-100 p-3"></div>
    </section>
</div>

<script>
(function(){
    let currentThreadId = null;

    const threadListEl = document.getElementById('hermesThreadList');
    const messagesEl = document.getElementById('hermesMessages');
    const footerEl = document.getElementById('hermesFooter');
    const newThreadBtn = document.getElementById('hermesNewThreadBtn');
    const layoutEl = document.getElementById('hermesLayout');
    const backBtn = document.getElementById('hermesBackBtn');

    // 모바일 전용 화면 전환('list' | 'thread') - 데스크톱 폭에서는
    // CSS 미디어쿼리가 적용 안 돼서 아무 시각적 효과가 없다.
    function setMobileView(view){ layoutEl.dataset.view = view; }
    backBtn.addEventListener('click', () => setMobileView('list'));

    const STATUS_TONE = {
        needs_clarification: 'bg-amber-100 text-amber-700',
        pending_confirmation: 'bg-blue-100 text-blue-700',
        success: 'bg-green-100 text-green-700',
        failed: 'bg-red-100 text-red-700',
        cancelled: 'bg-gray-200 text-gray-600',
    };

    function esc(s){
        const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
    }

    async function loadThreadList(){
        try{
            const res = await fetch('{{ url_for("admin.hermes_threads") }}');
            const data = await res.json();
            const threads = data.threads || [];
            if(!threads.length){
                threadListEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-6 px-3">아직 대화 기록이 없습니다.</p>';
                return;
            }
            threadListEl.innerHTML = threads.map(t => `
                <button class="w-full text-left px-3 py-2.5 border-b border-gray-100 hover:bg-gray-100 transition
                    ${t.thread_id === currentThreadId ? 'bg-blue-50' : ''}" data-thread-id="${t.thread_id}">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-medium text-gray-800 truncate flex-1">${esc(t.preview)}</span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full flex-shrink-0 ${STATUS_TONE[t.status] || 'bg-gray-100 text-gray-600'}">${esc(t.status_label)}</span>
                    </div>
                    <div class="text-[11px] text-gray-400 mt-0.5">${esc(t.time)}</div>
                </button>
            `).join('');
            threadListEl.querySelectorAll('[data-thread-id]').forEach(btn => {
                btn.addEventListener('click', () => openThread(btn.dataset.threadId));
            });
        }catch(e){
            threadListEl.innerHTML = '<p class="text-xs text-red-400 text-center py-6 px-3">목록을 불러오지 못했습니다.</p>';
        }
    }

    function renderComposer(placeholder, onSend){
        footerEl.innerHTML = `
            <div class="flex gap-2">
                <textarea id="hermesComposerInput" rows="1" placeholder="${esc(placeholder)}"
                    class="flex-1 resize-none px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                <button id="hermesComposerSend"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition">전송</button>
            </div>`;
        const input = document.getElementById('hermesComposerInput');
        const btn = document.getElementById('hermesComposerSend');
        const send = async () => {
            const text = input.value.trim();
            if(!text) return;
            input.disabled = true; btn.disabled = true;
            await onSend(text);
            input.disabled = false; btn.disabled = false;
        };
        btn.addEventListener('click', send);
        input.addEventListener('keydown', e => {
            if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
        });
        input.focus();
    }

    function renderConfirmCard(){
        footerEl.innerHTML = `
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
                <p class="text-sm text-gray-700 mb-2">위 내용으로 실행할까요?</p>
                <div class="flex gap-2">
                    <button id="hermesConfirmBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">확인</button>
                    <button id="hermesCancelBtn" class="flex-1 bg-white border border-gray-300 text-gray-600 font-medium py-2 rounded-lg hover:bg-gray-50 transition">취소</button>
                </div>
            </div>`;
        document.getElementById('hermesConfirmBtn').addEventListener('click', async () => {
            await fetch(`/admin/hermes/thread/${currentThreadId}/confirm`, {method: 'POST'});
            openThread(currentThreadId);
            loadThreadList();
        });
        document.getElementById('hermesCancelBtn').addEventListener('click', async () => {
            await fetch(`/admin/hermes/thread/${currentThreadId}/cancel`, {method: 'POST'});
            openThread(currentThreadId);
            loadThreadList();
        });
    }

    function renderNewThreadButton(){
        footerEl.innerHTML = `
            <button id="hermesStartOverBtn"
                class="w-full border border-gray-300 text-gray-600 font-medium py-2 rounded-lg hover:bg-gray-50 transition">
                + 새 대화 시작
            </button>`;
        document.getElementById('hermesStartOverBtn').addEventListener('click', startNewThread);
    }

    async function sendMessage(text){
        try{
            const res = await fetch('{{ url_for("admin.hermes_message") }}', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text, thread_id: currentThreadId}),
            });
            const data = await res.json();
            if(data.thread_id){
                currentThreadId = data.thread_id;
                await openThread(currentThreadId);
                loadThreadList();
            }
        }catch(e){
            messagesEl.insertAdjacentHTML('beforeend',
                '<div class="text-sm text-red-500">요청 전송에 실패했습니다.</div>');
        }
    }

    window.startNewThread = function(){
        currentThreadId = null;
        messagesEl.innerHTML = '<p class="text-sm text-gray-400 text-center py-10">확정된 지시를 입력해보세요.<br>예: "김민준 학생 10월 20일 5시 보강", "이정기 학생 오늘 결석 처리"</p>';
        renderComposer('예: 김민준 학생 10월 20일 5시 보강', sendMessage);
        threadListEl.querySelectorAll('[data-thread-id]').forEach(b => b.classList.remove('bg-blue-50'));
    };

    async function openThread(threadId){
        currentThreadId = threadId;
        setMobileView('thread');
        messagesEl.innerHTML = '<p class="text-sm text-gray-400 text-center py-10">불러오는 중...</p>';
        try{
            const res = await fetch(`/admin/hermes/thread/${threadId}`);
            const data = await res.json();
            if(data.error){
                messagesEl.innerHTML = `<p class="text-sm text-red-400 text-center py-10">${esc(data.error)}</p>`;
                return;
            }
            renderMessages(data.items);
        }catch(e){
            messagesEl.innerHTML = '<p class="text-sm text-red-400 text-center py-10">불러오지 못했습니다.</p>';
        }
    }

    function renderMessages(items){
        // 연속된 같은 raw_text는 사람 말풍선 1개 + agent 말풍선 여러 개로 묶는다
        // (복합 명령 1번 입력이 액션별로 로그 행을 여러 개 남기기 때문).
        const groups = [];
        for(const it of items){
            const last = groups[groups.length - 1];
            if(last && last.raw_text === it.raw_text){ last.items.push(it); }
            else { groups.push({raw_text: it.raw_text, items: [it]}); }
        }

        messagesEl.innerHTML = groups.map(g => `
            <div class="flex justify-end">
                <div class="bg-blue-600 text-white rounded-lg px-3 py-2 max-w-[75%] text-sm whitespace-pre-line">${esc(g.raw_text)}</div>
            </div>
            ${g.items.map(it => `
                <div class="flex justify-start">
                    <div class="rounded-lg px-3 py-2 max-w-[75%] text-sm whitespace-pre-line
                        ${it.status === 'success' ? 'bg-green-50 text-green-800' : it.status === 'failed' ? 'bg-red-50 text-red-800' : 'bg-gray-100 text-gray-800'}">
                        ${esc(it.agent_text || '')}
                    </div>
                </div>
            `).join('')}
        `).join('');
        messagesEl.scrollTop = messagesEl.scrollHeight;

        const latest = items[items.length - 1];
        if(latest.status === 'pending_confirmation'){ renderConfirmCard(); }
        else if(latest.status === 'needs_clarification'){
            if(latest.clarification && latest.clarification.type === 'course_choice'){
                renderChoiceComposer(latest.clarification.options);
            } else if(latest.clarification && latest.clarification.type === 'date'){
                renderDateComposer(latest.clarification.suggested_date);
            } else {
                renderComposer('답변을 입력하세요', sendMessage);
            }
        }
        else { renderNewThreadButton(); }
    }

    // "어느 수업인가요?" 질문에 자유 텍스트 대신 버튼으로 바로 고르게 한다
    // (2026-10-13, 직관적인 선택 UI 요청) - 클릭하면 그 수업 이름을 그대로
    // 답변 텍스트로 보내 기존 재파싱 흐름을 그대로 탄다(백엔드 변경 없음).
    function renderChoiceComposer(options){
        footerEl.innerHTML = `
            <div class="flex flex-wrap gap-2">
                ${options.map(o => `
                    <button class="hermes-choice-btn px-3 py-2 rounded-lg border border-gray-300 text-sm
                        text-gray-700 hover:bg-blue-50 hover:border-blue-400 hover:text-blue-700 transition"
                        data-label="${esc(o.label)}">${esc(o.label)}</button>
                `).join('')}
            </div>`;
        footerEl.querySelectorAll('.hermes-choice-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                footerEl.querySelectorAll('.hermes-choice-btn').forEach(b => b.disabled = true);
                sendMessage(btn.dataset.label);
            });
        });
    }

    // "날짜를 알려주세요" 질문에 날짜 입력기를 바로 띄운다(위와 같은 이유).
    // suggestedDate가 있으면(모모봇이 수업 요일 기준으로 추정한 날짜,
    // 2026-10-13) 그 날짜를 미리 채워서 사실상 "이 날짜 맞나요?" 확인만
    // 하면 되게 한다 - 비어있으면 오늘 날짜로 기본값을 둔다.
    function renderDateComposer(suggestedDate){
        const today = new Date().toISOString().slice(0, 10);
        footerEl.innerHTML = `
            <div class="flex gap-2">
                <input id="hermesDateInput" type="date" value="${suggestedDate || today}"
                    class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="hermesDateSend"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition">확인</button>
            </div>`;
        document.getElementById('hermesDateSend').addEventListener('click', () => {
            const val = document.getElementById('hermesDateInput').value;
            if(val) sendMessage(val);
        });
    }

    newThreadBtn.addEventListener('click', () => { startNewThread(); setMobileView('thread'); });

    // 초기 로드: 스레드 목록 + 새 대화 상태로 시작
    loadThreadList();
    startNewThread();
})();
</script>
{% endblock %}
