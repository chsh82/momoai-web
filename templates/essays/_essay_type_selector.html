<!-- 과제 유형 선택 - RW01(리라이팅)/RW02(기본과제글)/기타(적립 없음) 마일리지
     코드 분기와 BG01/BG03 뱃지 조건이 이 값을 그대로 사용한다. 첨삭 확정 후에는
     essays/<id>/update-essay-type PATCH로만 변경 가능하다.

     기본과제글을 기본 선택값으로 미리 체크해 둔다(2026-08-30 결정사항 -
     선택을 강제하지 않고 기본값 + 확정 화면 경고로 되돌림). 유형을 바꾸고
     싶으면 다른 탭을 직접 클릭해야 값이 바뀐다. 잘못된 유형으로 확정되는
     사고는 manual_correction.html의 확정 직전 경고 박스(현재 유형·지급
     예정 점수 표시)로 막는다. -->
<div class="mb-6">
    <label class="block text-gray-700 font-medium mb-3">과제 유형 <span class="text-red-500">*</span></label>
    <div class="grid grid-cols-3 gap-2" id="essay-type-selector">
        <label class="flex items-center justify-center gap-2 p-3 border-2 rounded-lg cursor-pointer transition essay-type-option" id="label-essay-type-basic">
            <input type="radio" name="essay_type" value="basic" class="accent-blue-600" checked>
            <span class="font-medium text-gray-800 text-sm">📄 기본과제글</span>
        </label>
        <label class="flex items-center justify-center gap-2 p-3 border-2 rounded-lg cursor-pointer transition essay-type-option" id="label-essay-type-rewriting">
            <input type="radio" name="essay_type" value="rewriting" class="accent-purple-600">
            <span class="font-medium text-gray-800 text-sm">✍️ 리라이팅</span>
        </label>
        <label class="flex items-center justify-center gap-2 p-3 border-2 rounded-lg cursor-pointer transition essay-type-option" id="label-essay-type-etc">
            <input type="radio" name="essay_type" value="etc" class="accent-gray-600">
            <span class="font-medium text-gray-800 text-sm">📎 기타</span>
        </label>
    </div>
    <p class="text-xs text-gray-500 mt-2">기본값은 기본과제글입니다. 리라이팅이면 반드시 탭을 바꿔주세요 - 유형에 따라 마일리지 적립 점수가 다르고, 첨삭 확정 후에는 변경할 수 없습니다.</p>
</div>
<script>
(function() {
    function updateEssayTypeOptionStyle() {
        document.querySelectorAll('.essay-type-option').forEach(function(label) {
            var radio = label.querySelector('input[type="radio"]');
            if (radio && radio.checked) {
                label.classList.add('border-blue-500', 'bg-blue-50');
                label.classList.remove('border-gray-200');
            } else {
                label.classList.remove('border-blue-500', 'bg-blue-50');
                label.classList.add('border-gray-200');
            }
        });
    }
    document.querySelectorAll('input[name="essay_type"]').forEach(function(radio) {
        radio.addEventListener('change', updateEssayTypeOptionStyle);
    });
    updateEssayTypeOptionStyle();
})();
</script>
