<fieldset class="mb-6 rounded-lg border border-purple-200 bg-purple-50 p-4">
    <legend class="font-semibold">보강 수업 제출 (선택)</legend>
    <p class="text-sm mb-2">아래 수업·날짜·강사를 확인한 뒤 별도 버튼으로 제출하세요. 이 글만 보강 강사에게 전달됩니다. 일반 제출은 기존 제출하기 버튼을 이용하세요.</p>
    <label for="makeup_session_id">보강 수업 / 날짜 / 담당 강사</label>
    <select id="makeup_session_id" name="makeup_session_id" class="w-full border rounded p-2 my-2">
        <option value="">-- 보강 수업을 직접 선택하세요 --</option>
        {% for lesson in makeup_sessions %}
        <option value="{{ lesson.session_id }}">{{ lesson.course.course_name }} / {{ lesson.session_date }}{% if lesson.start_time %} {{ lesson.start_time.strftime('%H:%M') }}{% endif %} / {{ lesson.course.teacher.name }}</option>
        {% endfor %}
    </select>
    {% if not makeup_sessions %}<p class="text-sm">제출 가능한 보강 수업이 없습니다. 등록 상태를 관리자에게 문의해주세요.</p>{% endif %}
</fieldset>
