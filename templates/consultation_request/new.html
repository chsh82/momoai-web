{% extends "base.html" %}

{% block title %}상담 신청 작성 - MOMOAI v4.0{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <h2 class="text-xl sm:text-2xl font-bold text-gray-800">✏️ 상담 신청</h2>
        <p class="text-sm text-gray-600 mt-1">관리자가 접수 후 확인하고 일정을 안내해드립니다.</p>
    </div>

    {% if not children %}
    <div class="bg-white rounded-lg shadow p-8 text-center text-gray-500">
        연결된 자녀가 없습니다. 먼저 자녀 연결을 완료해주세요.
    </div>
    {% else %}
    <form method="post" class="bg-white rounded-lg shadow p-6 space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">자녀</label>
            <select name="student_id" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">-- 선택하세요 --</option>
                {% for c in children %}
                <option value="{{ c.student_id }}">{{ c.display_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">상담 분류</label>
            <select name="category" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">-- 선택하세요 --</option>
                {% for c in categories %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">희망 일자 (선택)</label>
                <input type="date" name="preferred_date"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">희망 시간대 메모 (선택)</label>
                <input type="text" name="preferred_note" placeholder="예: 평일 오후 3시 이후"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">상담 사유</label>
            <textarea name="reason" rows="5" required
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="상담이 필요한 내용을 적어주세요."></textarea>
        </div>

        <div class="flex justify-end gap-2">
            <a href="{{ url_for('consultation_request.index') }}"
               class="px-4 py-2 text-sm bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200 transition duration-200">
                취소
            </a>
            <button type="submit"
                    class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-200 font-semibold">
                신청하기
            </button>
        </div>
    </form>
    {% endif %}
</div>
{% endblock %}
